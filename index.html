<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwasthyaPlate - Diabetic-Friendly Indian Meal Planner</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --primary: #38bdf8;
            --primary-glow: rgba(56, 189, 248, 0.15);
            --success: #10b981;
            --accent: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: #0f172a;
        }

        * { box-sizing: border-box; color-scheme: dark; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px 12px;
            display: flex;
            justify-content: center;
        }

        .dashboard {
            width: 100%;
            max-width: 1100px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
        }

        .header { text-align: center; margin-bottom: 24px; }
        .header h2 { margin: 0; font-size: 1.6rem; color: var(--primary); font-weight: 800; }
        .header p { margin: 6px 0 0 0; font-size: 0.85rem; color: var(--text-muted); }

        .control-panel {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 24px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        .control-group label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 8px;
        }

        .btn-group {
            display: flex;
            gap: 6px;
        }

        .select-btn {
            flex: 1;
            background: #0f172a;
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 8px 10px;
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .select-btn.active, .select-btn:hover {
            background: var(--primary);
            color: #0f172a;
            border-color: var(--primary);
        }

        .section-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .recipes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .recipe-card {
            background: #0f172a;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .recipe-card:hover { border-color: var(--primary); transform: translateY(-2px); }

        .recipe-card h4 { margin: 0 0 6px 0; font-size: 1rem; color: var(--text-main); display: flex; justify-content: space-between; align-items: center; }
        .recipe-card p { margin: 0 0 12px 0; font-size: 0.8rem; color: var(--text-muted); line-height: 1.4; }

        .tag-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
        .tag { font-size: 0.68rem; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: rgba(56, 189, 248, 0.1); color: var(--primary); border: 1px solid rgba(56, 189, 248, 0.3); }
        .tag-gi { background: rgba(16, 185, 129, 0.1); color: var(--success); border-color: rgba(16, 185, 129, 0.3); }

        .view-btn {
            background: transparent;
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 8px;
            text-align: center;
            transition: all 0.2s;
        }
        .recipe-card:hover .view-btn { background: var(--primary); color: #0f172a; border-color: var(--primary); }

        /* Modal Overlay for Recipe Details */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 16px;
        }
        .modal-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 650px;
            max-height: 85vh;
            overflow-y: auto;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; border-bottom: 1px solid var(--card-border); padding-bottom: 12px; }
        .modal-header h3 { margin: 0; font-size: 1.3rem; color: var(--primary); }
        .close-btn { background: none; border: none; color: var(--text-muted); font-size: 1.4rem; cursor: pointer; }
        .close-btn:hover { color: var(--text-main); }

        .recipe-section-title { font-size: 0.85rem; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.05em; margin: 16px 0 8px 0; }
        .recipe-detail-box ul, .recipe-detail-box ol { margin: 0; padding-left: 20px; font-size: 0.85rem; color: var(--text-muted); line-height: 1.6; }
        .recipe-detail-box li { margin-bottom: 6px; color: var(--text-main); }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="header">
        <h2>🥗 SwasthyaPlate India</h2>
        <p>Diabetic-Friendly Indian Cuisine Meal Planner & Recipe Guide</p>
    </div>

    <!-- Control Panel Selection Filters -->
    <div class="control-panel">
        <div class="control-group">
            <label>Meal Time</label>
            <div class="btn-group">
                <button class="select-btn active" onclick="setMeal('Breakfast', event)">Breakfast</button>
                <button class="select-btn" onclick="setMeal('Lunch', event)">Lunch</button>
                <button class="select-btn" onclick="setMeal('Dinner', event)">Dinner</button>
            </div>
        </div>
        <div class="control-group">
            <label>Dietary Preference</label>
            <div class="btn-group">
                <button class="select-btn active" onclick="setDiet('Veg', event)">Veg</button>
                <button class="select-btn" onclick="setDiet('Non-Veg', event)">Non-Veg</button>
            </div>
        </div>
    </div>

    <!-- Recipe Display Section -->
    <div class="section-label">
        <span>Recommended Recipes for <span id="activeSelectionLabel">Breakfast • Veg</span></span>
        <span style="font-size: 0.75rem; color: var(--text-muted);">Low GI & Balanced Macros</span>
    </div>

    <div class="recipes-grid" id="recipesGrid"></div>
</div>

<!-- Recipe Details Modal -->
<div class="modal-overlay" id="recipeModal" onclick="if(event.target === this) closeModal()">
    <div class="modal-card">
        <div class="modal-header">
            <div>
                <h3 id="modalTitle">Dish Name</h3>
                <div class="tag-row" id="modalTags" style="margin-top: 8px; margin-bottom: 0;"></div>
            </div>
            <button class="close-btn" onclick="closeModal()">&times;</button>
        </div>
        <div class="recipe-detail-box">
            <div class="recipe-section-title">Ingredients</div>
            <ul id="modalIngredients"></ul>

            <div class="recipe-section-title">Preparation Steps</div>
            <ol id="modalSteps"></ol>
        </div>
    </div>
</div>
