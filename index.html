<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV vs Fuel Cost & Savings Calculator (TN Tariff)</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --primary: #2563eb;
            --success: #16a34a;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border-color: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            color-scheme: light !important;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
        }

        .container {
            max-width: 820px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
        }

        h2 {
            margin-top: 0;
            text-align: center;
            font-size: 1.4rem;
            color: var(--primary);
            font-weight: 700;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }

        .section-title {
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin: 16px 0 8px 0;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: #1e293b;
        }

        input, select {
            width: 100%;
            padding: 10px 12px;
            font-size: 0.95rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: #ffffff !important;
            color: #0f172a !important;
            display: block;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .grid-2 {
            display: flex;
            gap: 10px;
            margin-bottom: 6px;
        }

        .grid-2 > div {
            flex: 1;
            min-width: 0;
        }

        .car-visual-card {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .car-image-container {
            width: 100%;
            min-height: 120px;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            padding: 12px;
            text-align: center;
        }

        .car-image-container svg {
            width: 44px;
            height: 44px;
            fill: var(--primary);
            margin-bottom: 6px;
        }

        #previewName {
            font-weight: 700;
            font-size: 0.95rem;
            color: #1e3a8a;
            word-break: break-word;
        }

        .spec-badge {
            background-color: #eff6ff;
            border-left: 4px solid var(--primary);
            padding: 10px 12px;
            margin-top: 12px;
            border-radius: 6px;
            font-size: 0.82rem;
            line-height: 1.45;
            color: #1e3a8a;
        }

        .output-card {
            background: #f1f5f9;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            grid-column: 1 / -1;
        }

        .output-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.92rem;
        }

        .highlight-box {
            background: #f0fdf4;
            border: 1px solid #b7ebc9;
            padding: 14px;
            border-radius: 8px;
            margin-top: 14px;
            text-align: center;
        }

        .highlight-box small {
            color: #15803d;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
        }

        .highlight-box span {
            display: block;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--success);
            margin-top: 4px;
        }

        .chart-container {
            margin-top: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chart-bar-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
        }

        .chart-label {
            width: 60px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .chart-track {
            flex-grow: 1;
            background: #e2e8f0;
            border-radius: 6px;
            height: 20px;
            overflow: hidden;
        }

        .chart-fill {
            height: 100%;
            background: var(--success);
            border-radius: 6px;
            width: 0%;
            transition: width 0.3s ease-in-out;
        }

        .chart-value {
            width: 90px;
            text-align: right;
            font-weight: 700;
            color: var(--text-main);
        }

        hr {
            border: 0;
            border-top: 1px solid var(--border-color);
            margin: 16px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>⚡ EV vs. Fuel Cost & Savings Calculator</h2>

    <div class="main-layout">
        <div>
            <div class="section-title" style="margin-top:0;">1. Driving & Fuel Inputs</div>
            <div class="form-group">
                <label>Monthly Driving Distance (km)</label>
                <input type="number" id="monthlyKm" value="1500" oninput="calculate()">
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label>Fuel Price (₹ / Litre)</label>
                    <input type="number" id="fuelPrice" value="102" oninput="calculate()">
                </div>
                <div class="form-group">
                    <label>Fuel Mileage (km / L)</label>
                    <input type="number" id="fuelMileage" value="14" oninput="calculate()">
                </div>
            </div>

            <hr>

            <div class="section-title">2. Select EV Model</div>
            <div class="grid-2">
                <div class="form-group">
                    <label>EV Brand</label>
                    <select id="brandSelect" onchange="populateSubModels()"></select>
                </div>
                <div class="form-group">
                    <label>Sub-Model Variant</label>
                    <select id="modelSelect" onchange="calculate()"></select>
                </div>
            </div>
        </div>

        <div class="car-visual-card">
            <div>
                <div class="section-title" style="margin-top:0;">Vehicle Preview</div>
                <div class="car-image-container">
