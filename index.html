<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwasthyaPlate India - Diabetic-Friendly Indian Meal Planner</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --primary: #38bdf8;
            --primary-glow: rgba(56, 189, 248, 0.15);
            --success: #10b981;
            --accent: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: #0f172a;
        }

        * { box-sizing: border-box; color-scheme: dark; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px 12px;
            display: flex;
            justify-content: center;
        }

        .dashboard {
            width: 100%;
            max-width: 1200px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
        }

        .header { text-align: center; margin-bottom: 24px; }
        .header h2 { margin: 0; font-size: 1.6rem; color: var(--primary); font-weight: 800; }
        .header p { margin: 6px 0 0 0; font-size: 0.85rem; color: var(--text-muted); }

        .control-panel {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-end;
        }

        .control-group { flex: 1; min-width: 220px; }
        .control-group label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 8px;
        }

        .btn-group { display: flex; gap: 8px; }

        .select-btn {
            flex: 1;
            background: #0f172a;
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .select-btn.active, .select-btn:hover {
            background: var(--primary);
            color: #0f172a;
            border-color: var(--primary);
        }

        .action-submit-btn {
            background: var(--success);
            color: #0f172a;
            border: none;
            padding: 11px 24px;
            font-size: 0.9rem;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: opacity 0.2s;
            height: 42px;
        }
        .action-submit-btn:hover { opacity: 0.9; }

        /* Master-Detail Layout */
        .master-detail-grid {
            display: grid;
            grid-template-columns: 1fr 1.3fr;
            gap: 20px;
            min-height: 480px;
        }

        @media (max-width: 900px) {
            .master-detail-grid { grid-template-columns: 1fr; }
        }

        .panel-box {
            background: #0f172a;
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            max-height: 520px;
            overflow-y: auto;
        }

        .panel-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--card-border);
        }

        .dish-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .dish-item-card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .dish-item-card:hover, .dish-item-card.selected {
            border-color: var(--primary);
            background: rgba(56, 189, 248, 0.08);
            transform: translateX(2px);
        }

        .dish-item-card h4 { margin: 0 0 4px 0; font-size: 0.95rem; color: var(--text-main); }
        .dish-item-card p { margin: 0; font-size: 0.78rem; color: var(--text-muted); }

        .tag-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
        .tag { font-size: 0.65rem; font-weight: 700; padding: 2px 6px; border-radius: 6px; background: rgba(56, 189, 248, 0.1); color: var(--primary); border: 1px solid rgba(56, 189, 248, 0.3); }
        .tag-gi { background: rgba(16, 185, 129, 0.1); color: var(--success); border-color: rgba(16, 185, 129, 0.3); }

        /* Right Detail Panel Styles */
        .detail-placeholder {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: var(--text-muted);
            text-align: center;
            padding: 40px;
            font-size: 0.9rem;
        }

        .recipe-detail-content h3 { margin: 0 0 10px 0; font-size: 1.2rem; color: var(--text-main); }
        .recipe-section-title { font-size: 0.8rem; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.05em; margin: 16px 0 8px 0; }
        .recipe-detail-content ul, .recipe-detail-content ol { margin: 0; padding-left: 20px; font-size: 0.84rem; color: var(--text-muted); line-height: 1.6; }
        .recipe-detail-content li { margin-bottom: 6px; color: var(--text-main); }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="header">
        <h2>🥗 SwasthyaPlate India</h2>
        <p>Diabetic-Friendly Indian Cuisine Menu & Recipe Explorer</p>
    </div>

    <!-- Control Panel -->
    <div class="control-panel">
        <div class="control-group">
            <label>Meal Time</label>
            <div class="btn-group" id="mealGroup">
                <button class="select-btn active" onclick="selectMeal('Breakfast', event)">Breakfast</button>
                <button class="select-btn" onclick="selectMeal('Lunch', event)">Lunch</button>
                <button class="select-btn" onclick="selectMeal('Dinner', event)">Dinner</button>
            </div>
        </div>
        <div class="control-group">
            <label>Dietary Preference</label>
            <div class="btn-group" id="dietGroup">
                <button class="select-btn active" onclick="selectDiet('Veg', event)">Veg</button>
                <button class="select-btn" onclick="selectDiet('Non-Veg', event)">Non-Veg</button>
            </div>
        </div>
        <div>
            <button class="action-submit-btn" onclick="loadDishMenu()">See the Dish Menu</button>
        </div>
    </div>

    <!-- Master-Detail Split Screen -->
    <div class="master-detail-grid">
        <!-- Left Panel: List of Dishes -->
        <div class="panel-box">
            <div class="panel-title">Dish Menu (<span id="menuCount">0</span>)</div>
            <div class="dish-list" id="dishListContainer">
                <div class="detail-placeholder">Select your preferences above and click <strong>"See the Dish Menu"</strong> to view available dishes.</div>
            </div>
        </div>

        <!-- Right Panel: Ingredients & Preparation -->
        <div class="panel-box" id="rightDetailPanel">
            <div class="detail-placeholder">
                <div>
                    <div style="font-size: 2rem; margin-bottom: 8px;">📖</div>
                    Select a dish from the menu on the left to view its ingredients and preparation steps here.
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    var database = [
        // --- BREAKFAST : VEG ---
        {
            id: 1, meal: "Breakfast", diet: "Veg", name: "Moong Dal & Vegetable Chilla", gi: "Low GI", calories: "180 kcal",
            desc: "High protein savory pancake made from split yellow lentils and finely chopped vegetables.",
            ingredients: [
                "1 cup Yellow Moong Dal (soaked for 2 hours)",
                "1/2 cup finely chopped spinach and grated carrots",
                "1 inch ginger & 1 green chili (chopped)",
                "1 tsp cumin seeds (jeera)",
                "Salt to taste",
                "1 tsp cold-pressed mustard or groundnut oil"
            ],
            steps: [
                "Drain the soaked moong dal and blend into a smooth batter with ginger and green chili.",
                "Transfer batter to a bowl, mix in chopped spinach, grated carrots, and salt.",
                "Heat a non-stick pan on medium heat and grease lightly with oil.",
                "Pour a ladle of batter and spread into a circular pancake.",
                "Cook on both sides until golden brown and crispy. Serve hot with mint-coriander chutney."
            ]
        },
        {
            id: 2, meal: "Breakfast", diet: "Veg", name: "Oats & Methi Uttapam", gi: "High Fiber", calories: "210 kcal",
            desc: "Heart-healthy savory pancakes made with rolled oats and fresh fenugreek leaves.",
            ingredients: [
                "1 cup rolled oats (ground to coarse flour)",
                "1/4 cup besan (gram flour)",
                "1/2 cup fresh methi (fenugreek) leaves, chopped",
                "1/2 cup low-fat curd (dahi)",
                "Chopped onions and tomatoes for topping",
                "Salt and turmeric powder to taste"
            ],
            steps: [
                "Mix oat flour, besan, curd, and water to form a thick uttapam batter.",
                "Stir in chopped methi leaves, salt, and turmeric.",
                "Heat a tawa, pour a small ladle of batter, and top with onions and tomatoes.",
                "Drizzle a few drops of oil around edges, cover, and cook on medium flame until bottom is golden."
            ]
        },

        // --- BREAKFAST : NON-VEG ---
        {
            id: 3, meal: "Breakfast", diet: "Non-Veg", name: "Masala Vegetable Egg Bhurji", gi: "Low Carb", calories: "220 kcal",
            desc: "Protein-packed scrambled eggs loaded with fiber-rich onions, tomatoes, and bell peppers.",
            ingredients: [
                "3 whole eggs",
                "1 medium onion, finely chopped",
                "1 tomato, chopped",
                "1/2 capsicum (bell pepper), diced",
                "1/4 tsp turmeric and black pepper powder",
                "1 tsp cooking oil or ghee",
                "Fresh coriander leaves"
            ],
            steps: [
                "Heat oil in a pan, sauté chopped onions until translucent.",
                "Add diced capsicum and tomatoes, cooking until tender.",
                "Crack eggs directly into the pan, add salt, turmeric, and black pepper.",
                "Scramble continuously on medium heat until cooked to your preference. Garnish with coriander."
            ]
        },
        {
            id: 4, meal: "Breakfast", diet: "Non-Veg", name: "Spinach Egg White Omelet", gi: "Low GI", calories: "160 kcal",
            desc: "Light and fluffy egg white omelet packed with iron-rich sautéed spinach and herbs.",
            ingredients: [
                "4 egg whites (1 whole egg optional)",
                "1 cup fresh spinach leaves, chopped",
                "1 clove garlic, minced",
                "Pinch of cumin powder and black pepper",
                "1 tsp olive oil or cold-pressed oil"
            ],
            steps: [
                "Sauté minced garlic and chopped spinach in a pan with half a teaspoon of oil until wilted.",
                "Whisk egg whites with black pepper, cumin powder, and a pinch of salt.",
                "Pour egg whites over the spinach layer in the pan.",
                "Cook on low heat until set, fold in half, and serve warm."
            ]
        },

        // --- LUNCH : VEG ---
        {
            id: 5, meal: "Lunch", diet: "Veg", name: "Lauki Chana Dal Sabzi with Jowar Roti", gi: "Low GI", calories: "320 kcal",
            desc: "Nutritious bottle gourd and split bengal gram curry paired with wholesome sorghum flatbread.",
            ingredients: [
                "1 cup diced lauki (bottle gourd)",
                "1/4 cup chana dal (soaked)",
                "1 onion & 1 tomato, chopped",
                "1/2 tsp turmeric, coriander powder, and garam masala",
                "2 Jowar rotis",
                "Side of fresh cucumber and tomato salad"
            ],
            steps: [
                "Pressure cook chana dal and lauki with turmeric and salt for 3 whistles until tender.",
                "In a pan, sauté onions and tomatoes with spices to form a light masala base.",
                "Mix the cooked dal-lauki mixture into the masala, simmer for 5 minutes.",
                "Serve hot with 2 warm jowar rotis and raw salad."
            ]
        },
        {
            id: 6, meal: "Lunch", diet: "Veg", name: "Palak Paneer with Brown Rice", gi: "Diabetic Friendly", calories: "350 kcal",
            desc: "Cottage cheese cubes simmered in a smooth, spiced spinach gravy with unpolished brown rice.",
            ingredients: [
                "200g low-fat paneer cubes",
                "2 cups fresh spinach leaves (blanched & pureed)",
                "1 onion, 1 tomato paste",
                "1 tsp garlic-ginger paste",
                "1/2 cup cooked brown rice",
                "1 tsp ghee or mustard oil"
            ],
            steps: [
                "Blanch spinach leaves and blend into a smooth green puree.",
                "Heat ghee in a pan, sauté ginger-garlic paste and onion paste until golden.",
                "Add tomato paste and spices (cumin, coriander, pinch of garam masala).",
                "Stir in spinach puree and paneer cubes, simmer for 5 minutes. Serve with brown rice."
            ]
        },

        // --- LUNCH : NON-VEG ---
        {
            id: 7, meal: "Lunch", diet: "Non-Veg", name: "Homestyle Chicken Curry with Multigrain Roti", gi: "Low Glycemic", calories: "380 kcal",
            desc: "Lean chicken breast cooked in a light onion-tomato gravy with minimal oil, paired with multigrain rotis.",
            ingredients: [
                "150g boneless chicken breast, cubed",
                "1 onion & 1 tomato, finely chopped",
                "1 tsp ginger-garlic paste",
                "1/2 tsp turmeric, red chili powder, coriander powder",
                "2 Multigrain rotis (wheat + ragi + besan)"
            ],
            steps: [
                "Heat oil in a pan, sauté ginger-garlic paste and chopped onions until golden brown.",
                "Add tomatoes and spice powders, cooking until oil separates slightly.",
                "Add chicken cubes and sear well, then add 1/2 cup water, cover, and simmer until tender.",
                "Serve hot alongside 2 warm multigrain rotis."
            ]
        },
        {
            id: 8, meal: "Lunch", diet: "Non-Veg", name: "Baked Fish Curry with Brown Rice", gi: "Heart & Sugar Friendly", calories: "340 kcal",
            desc: "Omega-3 rich fish fillet simmered in a tangy tamarind and tomato broth.",
            ingredients: [
                "200g firm fish fillets (seer fish or rohu)",
                "1 tomato and small lemon-sized tamarind extract",
                "1/2 cup sliced shallots (small onions)",
                "1/2 tsp mustard seeds, fenugreek seeds, and curry leaves",
                "1/2 cup cooked brown rice"
            ],
            steps: [
                "Sauté mustard seeds, fenugreek seeds, curry leaves, and shallots in 1 tsp oil.",
                "Add tomato pulp, turmeric, coriander, and diluted tamarind extract; boil into a gravy.",
                "Gently drop in fish fillets, cover, and simmer for 8-10 minutes until flaky.",
                "Serve warm over a portion of brown rice."
            ]
        },

        // --- DINNER : VEG ---
        {
            id: 9, meal: "Dinner", diet: "Veg", name: "Methi Dal Palak Soup & Stir-Fried Veggies", gi: "Very Low Carb", calories: "220 kcal",
            desc: "Light, soothing lentil soup blended with fenugreek and spinach greens, served with sautéed vegetables.",
            ingredients: [
                "1/3 cup yellow moong dal",
                "1 cup mixed chopped greens (methi and palak)",
                "1/2 tsp cumin seeds and garlic cloves",
                "1 cup mixed stir-fried broccoli, beans, and carrots"
            ],
            steps: [
                "Pressure cook moong dal, chopped greens, turmeric, and garlic with 2 cups of water.",
                "Temper with cumin seeds in a few drops of ghee.",
                "Lightly stir-fry broccoli, beans, and carrots with black pepper and salt.",
                "Enjoy together as a light, blood-sugar stable evening meal."
            ]
        },
        {
            id: 10, meal: "Dinner", diet: "Veg", name: "Stuffed Bhindi (Okra) with Phulkas", gi: "Low GI", calories: "260 kcal",
            desc: "Tender okra slit and stuffed with aromatic roasted spices, cooked with minimal oil.",
            ingredients: [
                "200g fresh tender bhindi, slit lengthwise",
                "Spices for stuffing: 1 tsp fennel powder, 1 tsp coriander powder, pinch of amchur, turmeric, and salt",
                "1 tsp mustard or peanut oil",
                "2 whole wheat phulkas"
            ],
            steps: [
                "Mix all dry spice powders in a bowl.",
                "Stuff the spice mixture gently inside the slit okra pods.",
                "Heat oil in a pan, arrange stuffed bhindi, cover, and cook on low heat, turning occasionally until tender.",
                "Serve with 2 light phulkas."
            ]
        },

        // --- DINNER : NON-VEG ---
        {
            id: 11, meal: "Dinner", diet: "Non-Veg", name: "Grilled Herb Chicken Breast & Salad", gi: "Zero Sugar Spike", calories: "290 kcal",
            desc: "Tender marinated chicken breast pan-grilled with herbs and served with a crisp cucumber-tomato salad.",
            ingredients: [
                "150g chicken breast",
                "1 tsp lemon juice, black pepper, crushed garlic, and dried oregano",
                "1 tsp olive oil",
                "Large bowl of cucumber, carrot, and lettuce salad with lemon dressing"
            ],
            steps: [
                "Marinate chicken breast with lemon juice, garlic, oregano, black pepper, and salt for 15 minutes.",
                "Heat olive oil in a grill pan over medium heat.",
                "Cook chicken for 5-6 minutes per side until golden brown and thoroughly cooked through.",
                "Serve alongside a refreshing raw vegetable salad."
            ]
        },
        {
            id: 12, meal: "Dinner", diet: "Non-Veg", name: "Clear Chicken & Vegetable Soup", gi: "Low Calorie", calories: "210 kcal",
            desc: "Nourishing, slow-simmered broth with shredded chicken, mushrooms, and leafy greens.",
            ingredients: [
                "100g shredded boiled chicken",
                "1 cup sliced mushrooms, baby corn, and bok choy or spinach",
                "1 tbsp minced ginger and garlic",
                "Crushed black pepper and soy sauce (low sodium)"
            ],
            steps: [
                "Boil ginger, garlic, and chicken bones or shredded chicken in 3 cups of water for flavorful broth.",
                "Add sliced mushrooms, baby corn, and greens into the simmering broth.",
                "Season with crushed black pepper and salt.",
                "Serve hot for an easy-to-digest, low-glycemic dinner."
            ]
        }
    ];

    var selectedMeal = 'Breakfast';
    var selectedDiet = 'Veg';

    function selectMeal(meal, event) {
        selectedMeal = meal;
        updateGroupActive('mealGroup', event.target);
    }

    function selectDiet(diet, event) {
        selectedDiet = diet;
        updateGroupActive('dietGroup', event.target);
    }

    function updateGroupActive(groupId, activeBtn) {
        var group = document.getElementById(groupId);
        var buttons = group.querySelectorAll('.select-btn');
        buttons.forEach(b => b.classList.remove('active'));
        activeBtn.classList.add('active');
    }

    function loadDishMenu() {
        var container = document.getElementById('dishListContainer');
        container.innerHTML = '';

        var filtered = database.filter(r => r.meal === selectedMeal && r.diet === selectedDiet);
        document.getElementById('menuCount').textContent = filtered.length;

        if (filtered.length === 0) {
            container.innerHTML = '<div class="detail-placeholder">No dishes found for this selection.</div>';
            return;
        }

        filtered.forEach(recipe => {
            var card = document.createElement('div');
            card.className = 'dish-item-card';
            card.innerHTML = 
                '<h4>' + recipe.name + '</h4>' +
                '<p>' + recipe.desc + '</p>' +
                '<div class="tag-row">' +
                    '<span class="tag tag-gi">' + recipe.gi + '</span>' +
                    '<span class="tag">' + recipe.calories + '</span>' +
                '</div>';

            card.onclick = function() {
                document.querySelectorAll('.dish-item-card').forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
                showRecipeDetails(recipe);
            };

            container.appendChild(card);
        });

        // Reset right panel prompt
        document.getElementById('rightDetailPanel').innerHTML = `
            <div class="panel-title">Recipe Details & Preparation</div>
            <div class="detail-placeholder">
                <div>👉 Click on any dish from the left menu to view ingredients and step-by-step instructions.</div>
            </div>
        `;
    }

    // Automatically load initial menu on page load so dishes appear immediately
    window.onload = function() {
        loadDishMenu();
    };
</script>

</body>
</html>
