<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV vs Fuel Cost & Savings Calculator</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --success: #16a34a;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
        }
        h2 {
            margin-top: 0;
            text-align: center;
            font-size: 1.5rem;
            color: var(--primary);
            font-weight: 700;
        }
        .section-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin: 20px 0 10px 0;
            font-weight: 700;
        }
        .form-group {
            margin-bottom: 14px;
        }
        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 5px;
            color: #334155;
        }
        input, select {
            width: 100%;
            padding: 10px 14px;
            font-size: 0.95rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-sizing: border-box;
            background: #fff;
            color: var(--text-main);
            transition: border-color 0.2s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .spec-badge {
            background-color: #eff6ff;
            border-left: 4px solid var(--primary);
            padding: 12px 14px;
            margin-top: 12px;
            border-radius: 6px;
            font-size: 0.88rem;
            line-height: 1.5;
            color: #1e3a8a;
        }
        .output-card {
            background: #f1f5f9;
            padding: 20px;
            border-radius: 12px;
            margin-top: 24px;
        }
        .output-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }
        .highlight-box {
            background: #f0fdf4;
            border: 1px solid #dcfce7;
            padding: 16px;
            border-radius: 8px;
            margin-top: 16px;
            text-align: center;
        }
        .highlight-box small {
            color: #15803d;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            font-size: 0.75rem;
        }
        .highlight-box span {
            display: block;
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--success);
            margin-top: 4px;
        }
        /* Year-wise table layout */
        .savings-table {
            width: 100%;
            margin-top: 16px;
            border-collapse: collapse;
            font-size: 0.88rem;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        .savings-table th, .savings-table td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        .savings-table th {
            background: #f8fafc;
            font-weight: 600;
            color: var(--text-muted);
        }
        .savings-table tr:last-child td {
            border-bottom: none;
        }
        hr {
            border: 0;
            border-top: 1px solid var(--border-color);
            margin: 20px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>⚡ EV vs. Fuel Total Cost & Savings Analyzer</h2>

    <div class="section-title">1. Driving & Fuel Inputs</div>
    <div class="form-group">
        <label>Monthly Driving Distance (km)</label>
        <input type="number" id="monthlyKm" value="1500" oninput="calculate()">
    </div>

    <div class="grid-2">
        <div class="form-group">
            <label>Fuel Price (₹ / Litre)</label>
            <input type="number" id="fuelPrice" value="102" oninput="calculate()">
        </div>
        <div class="form-group">
