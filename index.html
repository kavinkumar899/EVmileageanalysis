<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwasthyaPlate India - Comprehensive Diabetic-Friendly Meal Planner</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --primary: #38bdf8;
            --primary-glow: rgba(56, 189, 248, 0.15);
            --success: #10b981;
            --accent: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: #0f172a;
        }

        * { box-sizing: border-box; color-scheme: dark; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px 12px;
            display: flex;
            justify-content: center;
        }

        .dashboard {
            width: 100%;
            max-width: 1250px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
        }

        .header { text-align: center; margin-bottom: 24px; }
        .header h2 { margin: 0; font-size: 1.6rem; color: var(--primary); font-weight: 800; }
        .header p { margin: 6px 0 0 0; font-size: 0.85rem; color: var(--text-muted); }

        .control-panel {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-end;
        }

        .control-group { flex: 1; min-width: 220px; }
        .control-group label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 8px;
        }

        .btn-group { display: flex; gap: 8px; }

        .select-btn {
            flex: 1;
            background: #0f172a;
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .select-btn.active, .select-btn:hover {
            background: var(--primary);
            color: #0f172a;
            border-color: var(--primary);
        }

        .action-submit-btn {
            background: var(--success);
            color: #0f172a;
            border: none;
            padding: 11px 24px;
            font-size: 0.9rem;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: opacity 0.2s;
            height: 42px;
        }
        .action-submit-btn:hover { opacity: 0.9; }

        /* Master-Detail Layout */
        .master-detail-grid {
            display: grid;
            grid-template-columns: 1fr 1.4fr;
            gap: 20px;
            min-height: 520px;
        }

        @media (max-width: 900px) {
            .master-detail-grid { grid-template-columns: 1fr; }
        }

        .panel-box {
            background: #0f172a;
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            height: 560px;
            overflow-y: auto;
        }

        .panel-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--card-border);
        }

        .dish-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .dish-item-card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .dish-item-card:hover, .dish-item-card.selected {
            border-color: var(--primary);
            background: rgba(56, 189, 248, 0.08);
            transform: translateX(2px);
        }

        .dish-item-card h4 { margin: 0 0 4px 0; font-size: 0.95rem; color: var(--text-main); }
        .dish-item-card p { margin: 0; font-size: 0.78rem; color: var(--text-muted); }

        .tag-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
        .tag { font-size: 0.65rem; font-weight: 700; padding: 2px 6px; border-radius: 6px; background: rgba(56, 189, 248, 0.1); color: var(--primary); border: 1px solid rgba(56, 189, 248, 0.3); }
        .tag-gi { background: rgba(16, 185, 129, 0.1); color: var(--success); border-color: rgba(16, 185, 129, 0.3); }

        /* Right Detail Panel Styles */
        .detail-placeholder {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: var(--text-muted);
            text-align: center;
            padding: 40px;
            font-size: 0.9rem;
        }

        .recipe-detail-content {
            overflow-y: auto;
            max-height: 480px;
            padding-right: 6px;
        }
        .recipe-detail-content h3 { margin: 0 0 10px 0; font-size: 1.2rem; color: var(--text-main); }
        .recipe-section-title { font-size: 0.8rem; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.05em; margin: 16px 0 8px 0; }
        .recipe-detail-content ul, .recipe-detail-content ol { margin: 0; padding-left: 20px; font-size: 0.84rem; color: var(--text-muted); line-height: 1.6; }
        .recipe-detail-content li { margin-bottom: 6px; color: var(--text-main); }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="header">
        <h2>🥗 SwasthyaPlate India</h2>
        <p>Comprehensive Diabetic-Friendly Indian Cuisine Menu & Recipe Explorer</p>
    </div>

    <!-- Control Panel -->
    <div class="control-panel">
        <div class="control-group">
            <label>Meal Time</label>
            <div class="btn-group" id="mealGroup">
                <button class="select-btn active" onclick="selectMeal('Breakfast', event)">Breakfast</button>
                <button class="select-btn" onclick="selectMeal('Lunch', event)">Lunch</button>
                <button class="select-btn" onclick="selectMeal('Dinner', event)">Dinner</button>
            </div>
        </div>
        <div class="control-group">
            <label>Dietary Preference</label>
            <div class="btn-group" id="dietGroup">
                <button class="select-btn active" onclick="selectDiet('Veg', event)">Veg</button>
                <button class="select-btn" onclick="selectDiet('Non-Veg', event)">Non-Veg</button>
            </div>
        </div>
        <div>
            <button class="action-submit-btn" onclick="loadDishMenu()">See the Dish Menu</button>
        </div>
    </div>

    <!-- Master-Detail Split Screen -->
    <div class="master-detail-grid">
        <!-- Left Panel: List of Dishes -->
        <div class="panel-box">
            <div class="panel-title">Dish Menu (<span id="menuCount">0</span>)</div>
            <div class="dish-list" id="dishListContainer">

        <!-- Right Panel: Ingredients & Preparation -->
        <div class="panel-box" id="rightDetailPanel">

                <div>

                    Select a dish from the menu on the left to view its ingredients and preparation steps here.
                </div>
            </div>
        </div>
    </div>
</div>
